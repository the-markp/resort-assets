version: "3.9"

# docker-compose.app.yml — run N app instances against the shared DB
# Usage: docker compose -f docker-compose.app.yml up -d --build --scale app=3

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL:         "postgresql+asyncpg://palma:${DB_PASSWORD:-palma}@db:5432/palma_assets"
      # SECRET_KEY MUST be identical across every instance — otherwise a JWT issued
      # by instance A will be rejected by instance B.
      SECRET_KEY:           "${SECRET_KEY:?Set SECRET_KEY in your environment or .env file}"
      TOKEN_EXPIRE_MINUTES: "480"
    ports:
      - "8000-8010:8000"   # let Docker assign a free host port per replica
    volumes:
      # Shared logo uploads — see note below on why this matters
      - uploads_data:/app/frontend/static/uploads
    networks:
      - gtracker_shared
    restart: unless-stopped
    deploy:
      replicas: 3           # only honored by `docker stack deploy`; for plain
                             # `docker compose up`, use --scale app=3 instead

volumes:
  uploads_data:

networks:
  gtracker_shared:
    external: true
    name: gtracker_shared   # attaches to the network created by docker-compose.db.yml

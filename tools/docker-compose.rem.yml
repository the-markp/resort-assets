# docker-compose.yml on Machine B
# Usage: docker compose -f docker-compose.rem.yml up -d --build

version: "3.9"
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
    restart: unless-stopped
    # No depends_on db, no db service — it's remote
# Custom pg_hba.conf for G-Tracker — allows connections from app instances
# running on OTHER PHYSICAL MACHINES on the same LAN, in addition to local
# Docker network connections.
#
# IMPORTANT: Replace 192.168.1.0/24 with your actual LAN subnet.
# Run `ip addr` on this machine to confirm your subnet if unsure.

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# Connections from inside the Docker network (other containers on this host)
local   all             all                                     trust
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256
host    all             all             172.16.0.0/12           scram-sha-256

# Connections from your LAN — adjust subnet to match your actual network
host    all             all             10.1.1.0/24          scram-sha-256

# If your second machine is on a different subnet, add another line, e.g.:
# host    all             all             10.0.0.0/24             scram-sha-256

# Reject everything else by default (implicit — no catch-all "all" rule above)
